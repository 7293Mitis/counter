<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>カウンター</title>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            margin: 0; 
            display: flex; 
            flex-direction: column; 
            height: 100vh; 
            background-color: #f0f4f8;
            touch-action: manipulation;
            user-select: none;
        }

        /* 目標表示エリア */
        .header { 
            padding: 15px; 
            background: #fff; 
            border-bottom: 2px solid #e1e8ed;
            text-align: center;
        }
        .goal-label { font-size: 0.8rem; color: #888; margin-bottom: 5px; display: block; }
        .goal-input { 
            font-size: 1.4rem; 
            width: 100px; 
            padding: 5px; 
            border: 2px solid #cbd5e0; 
            border-radius: 8px; 
            text-align: center;
            font-weight: bold;
            color: #2d3748;
        }

        /* メインカウントエリア */
        .display-area { 
            flex-grow: 1; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
        }
        .total { font-size: 7rem; font-weight: 900; color: #2b6cb0; line-height: 1; margin-bottom: 10px; }
        .status-text { font-size: 1.4rem; color: #4a5568; font-weight: bold; }

        /* ボタンエリア */
        .controls { 
            padding: 20px; 
            background: #fff; 
            display: grid; 
            grid-template-columns: repeat(2, 1fr); 
            gap: 12px;
            padding-bottom: calc(20px + env(safe-area-inset-bottom));
            border-radius: 24px 24px 0 0;
            box-shadow: 0 -5px 15px rgba(0,0,0,0.05);
        }

        button { 
            -webkit-appearance: none;
            border: none; 
            border-radius: 16px; 
            font-size: 1.8rem; 
            font-weight: bold; 
            padding: 22px 0; 
            cursor: pointer;
            box-shadow: 0 4px 0 rgba(0,0,0,0.1);
            transition: transform 0.05s;
        }
        
        button:active { transform: translateY(4px); box-shadow: none; opacity: 0.9; }

        .btn-plus { background-color: #48bb78; color: white; }
        .btn-reset { 
            background-color: #f56565; 
            color: white; 
            grid-column: span 2; 
            font-size: 1.1rem; 
            padding: 12px 0;
            margin-top: 10px;
            box-shadow: 0 2px 0 rgba(0,0,0,0.1);
        }

        .reached { color: #ed8936; animation: pulse 1s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
    </style>
</head>
<body>

    <div class="header">
        <span class="goal-label">GOAL / 目標値</span>
        <input type="number" id="goalInput" class="goal-input" value="100">
    </div>

    <div class="display-area">
        <div class="total" id="countDisplay">0</div>
        <div id="statusDisplay" class="status-text">あと 100</div>
    </div>

    <div class="controls">
        <button class="btn-plus" onclick="add(1)">+1</button>
        <button class="btn-plus" onclick="add(2)">+2</button>
        <button class="btn-plus" onclick="add(3)">+3</button>
        <button class="btn-plus" onclick="add(5)">+5</button>
        <button class="btn-reset" onclick="reset()">リセット</button>
    </div>

<script>
    // 状態の管理
    let state = {
        count: 0,
        goal: 100
    };

    // データの読み込み
    function loadData() {
        const saved = localStorage.getItem('myCounterData');
        if (saved) {
            state = JSON.parse(saved);
            document.getElementById('goalInput').value = state.goal;
        }
        updateDisplay(false); // 保存はせずに表示だけ更新
    }

    // データの保存
    function saveData() {
        state.goal = parseInt(document.getElementById('goalInput').value) || 0;
        localStorage.setItem('myCounterData', JSON.stringify(state));
    }
