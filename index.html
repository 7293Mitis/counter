<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>釣りカウンター</title>
    <style>
        /* スタイルは維持しつつ、タッチ操作をより確実に */
        body { 
            font-family: sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; 
            background-color: #f0f4f8; touch-action: manipulation; -webkit-user-select: none; user-select: none;
        }
        .header { padding: 20px; background: white; text-align: center; border-bottom: 2px solid #ddd; }
        .goal-label { font-size: 0.9rem; color: #666; font-weight: bold; }
        /* inputのサイズ調整と、スマホの「完了」ボタンを押しやすく */
        .goal-input { 
            font-size: 1.6rem; width: 140px; padding: 10px; border: 2px solid #ccc; 
            border-radius: 10px; text-align: center;
        }
        .display-area { flex-grow: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .total { font-size: 7rem; font-weight: bold; color: #1a73e8; margin: 0; }
        .status-text { font-size: 1.5rem; font-weight: bold; color: #444; height: 2rem; }
        
        .controls { 
            display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; padding: 20px; 
            background: white; padding-bottom: calc(20px + env(safe-area-inset-bottom));
        }
        button { 
            padding: 25px 0; font-size: 2rem; font-weight: bold; border: none; border-radius: 15px;
            background-color: #34a853; color: white; box-shadow: 0 5px 0 #27803f;
        }
        button:active { transform: translateY(4px); box-shadow: none; }
        .btn-reset { 
            background-color: #ea4335; grid-column: span 2; font-size: 1.2rem; padding: 15px 0;
            box-shadow: 0 5px 0 #b33429; margin-top: 10px;
        }
        .reached { color: #f39c12; }
    </style>
</head>
<body>

    <div class="header">
        <label class="goal-label">目標値</label><br>
        <input type="number" id="goalInput" class="goal-input" value="100" inputmode="numeric">
    </div>

    <div class="display-area">
        <div class="total" id="countDisplay">0</div>
        <div id="statusDisplay" class="status-text">あと 100</div>
    </div>

    <div class="controls">
        <button type="button" onclick="handleButtonClick(1)">+1</button>
        <button type="button" onclick="handleButtonClick(2)">+2</button>
        <button type="button" onclick="handleButtonClick(3)">+3</button>
        <button type="button" onclick="handleButtonClick(5)">+5</button>
        <button type="button" class="btn-reset" onclick="handleReset()">リセット</button>
    </div>

<script>
    // データの初期値
    let count = 0;
    let goal = 100;

    // 要素を取得
    const countEl = document.getElementById('countDisplay');
    const statusEl = document.getElementById('statusDisplay');
    const goalInputEl = document.getElementById('goalInput');

    // 保存機能（エラーが起きても無視して続行するように設定）
    function loadData() {
        try {
            const savedCount = localStorage.getItem('myCount');
            const savedGoal = localStorage.getItem('myGoal');
            if (savedCount !== null) count = parseInt(savedCount);
            if (savedGoal !== null) {
                goal = parseInt(savedGoal);
                goalInputEl.value = goal;
            }
        } catch (e) {
            console.log("Storage is blocked, but that's okay!");
        }
        updateDisplay();
    }

    function saveData() {
        try {
            localStorage.setItem('myCount', count);
            localStorage.setItem('myGoal', goalInputEl.value);
        } catch (e) {
            // 保存できなくても動作は止めない
        }
    }

    // 表示を更新
    function updateDisplay() {
        goal = parseInt(goalInputEl.value) || 0;
        countEl.innerText = count;

        if (count >= goal && goal > 0) {
            statusEl.innerHTML = "<span class='reached'>🎉 目標達成！</span>";
        } else {
            statusEl.innerHTML = "あと <span style='color:#e74c3c;'>" + (goal - count) + "</span>";
        }
        saveData();
    }

    // ボタンが押された時の処理
    function handleButtonClick(value) {
        count += value;
        // バイブレーション（動かなくてもエラーにしない）
        if (navigator.vibrate) navigator.vibrate(10);
        updateDisplay();
    }

    // リセット
    function handleReset() {
        if (confirm("カウントをリセットしますか？")) {
            count = 0;
            updateDisplay();
        }
    }

    // 入力欄が変更されたら即反映
    goalInputEl.addEventListener('input', updateDisplay);

    // 読み込み開始
    window.onload = loadData;
</script>

</body>
</html>
